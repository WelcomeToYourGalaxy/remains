# Apply update
#
# Runs apply_update.py, which unpacks every changed file from a single bundle and
# commits them together. One upload instead of a dozen, and either the whole
# update lands or none of it does.
#
# This file needs pasting by hand ONCE. After that, updating the project is:
#   1. replace apply_update.py in the repo root
#   2. Actions -> Apply update -> Run workflow
#
# Note the permissions block below. The built-in token may not modify anything
# under .github/workflows/, so apply_update.py parks workflow files in
# _workflows_to_copy/ and lists them at the end rather than failing the push.
name: Apply update

on:
  # {} not a bare colon. A bare `workflow_dispatch:` parses as a NULL value, which
  # GitHub rejects -- the workflow then shows as its filename in the Actions list
  # with no Run button, and no error anywhere saying why. Every other workflow in
  # this repo writes it as {}.
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Unpack the bundle
        # -u for the same reason as every other workflow here: buffered output
        # from a job that dies tells you nothing.
        run: python -u apply_update.py

      - name: Commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -z "$(git status --porcelain)" ]; then
            echo "Nothing changed -- the repository already matches this bundle."
            exit 0
          fi
          git status --short
          # Everything except the parked workflow copies, which are a manual step
          # and should not become repository content. A .gitignore entry is used
          # rather than an exclude pathspec: ':!dir' is not supported by every git
          # version, and it fails with "Unimplemented pathspec magic" rather than
          # quietly ignoring the flag.
          grep -qxF '_workflows_to_copy/' .gitignore 2>/dev/null \
            || echo '_workflows_to_copy/' >> .gitignore
          git add -A
          if git diff --staged --quiet; then
            echo "Only parked workflow files changed -- nothing to commit."
            exit 0
          fi
          git commit -m "chore: apply bundled update"
          BR="$(git rev-parse --abbrev-ref HEAD)"
          for i in 1 2 3 4 5; do
            if git push origin HEAD:"$BR"; then echo "pushed"; exit 0; fi
            git fetch origin "$BR" || true
            git rebase "origin/$BR" || { git rebase --abort || true; }
            echo "push race, retry $i"; sleep $((i * 5))
          done
          echo "push failed after 5 retries"; exit 1

      - name: What still needs doing by hand
        if: always()
        run: |
          if [ -d _workflows_to_copy ]; then
            echo "::warning::Workflow files in this bundle must be pasted by hand."
            ls -1 _workflows_to_copy | sed 's|^|  .github/workflows/|'
          else
            echo "No workflow files in this bundle -- nothing left to do."
          fi
