# .github/workflows/remains.yml
# Daily harvest of the "Live unearthings" layer -> remains.json.gz (committed to repo root).
# Repo: WelcomeToYourGalaxy/remains
#
# Four workflows live in this repo and they are all distinct:
#   remains.yml              this one -- the unearthings/decisions dot layer (daily)
#   remains_federations.yml  the open-data portal sweep, sharded (twice weekly)
#   cemeteries.yml           the global OSM cemetery/crematorium/mortuary directory (weekly)
#   wire.yml                 the topic news wire (every 6 hours)
#   lenses.yml               link-checks the curated resource lenses (weekly)
#
# harvest_remains.py FETCHES the ~2,200-portal registries from the projects repo
# (WelcomeToYourGalaxy/local-map, harvest_projects.py) rather than vendoring a copy,
# so the two never drift. Only list literals are parsed, never executed. If that
# fetch fails the federation sources skip and every other source still runs.
name: Harvest live unearthings

on:
  schedule:
    - cron: "42 7 * * *"        # daily, 07:42 UTC (offset from the projects repo's 06:17)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: harvest-remains
  cancel-in-progress: false

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # harvest_remains.py is pure stdlib -- nothing to install.

      - name: Run harvester
        env:
          # Nominatim politeness budget for this run (1 req/sec, hard-capped).
          # NAGPRA notices are geocoded to the holding institution's city; raise this
          # only if the diagnostic reports the budget exhausted.
          GEO_BUDGET: "900"
          # Override only if the projects repo moves or is renamed.
          # SIBLING_HARVESTER_URL: ""
          #
          # The NPS National NAGPRA grids (Inventories, Unclaimed Lists) carry counts
          # of individuals still held per institution -- nothing else does. Their JSON
          # endpoint is undocumented, so fetch_nps_nagpra_grid() PROBES for it at run
          # time and prints what it finds. If run 1 reports no endpoint, open the
          # network tab on apps.cr.nps.gov/nagprapublic/Home/Inventory, copy the URL
          # the grid actually calls, and set it here (comma-separated for both grids).
          # NPS_GRID_PATHS: ""
        run: python harvest_remains.py

      - name: Commit refreshed remains.json.gz
        # Do NOT merge. These jobs REGENERATE the file wholesale, so there is
        # nothing to reconcile -- and `git merge -X ours` cannot help anyway:
        # -X ours resolves conflicting hunks INSIDE a file, and does nothing for a
        # modify/delete TREE conflict. That is exactly what happens when the file
        # was deleted on the remote while this job rebuilt it, which is what broke
        # the 2026-07-30 run: five identical CONFLICT (modify/delete) retries, then
        # exit 1, with a perfectly good 1,887-record harvest thrown away.
        #
        # So: take the remote exactly as it is, drop our freshly built file on top,
        # commit that. Survives deletes, concurrent edits and unrelated commits.
        env:
          FILES: "remains.json.gz"
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -z "$(git status --porcelain -- $FILES)" ]; then
            echo "No change in $FILES -- nothing to commit."
            exit 0
          fi
          KEEP="$(mktemp -d)"
          for f in $FILES; do [ -f "$f" ] && cp "$f" "$KEEP/$(basename "$f")"; done
          BR="$(git rev-parse --abbrev-ref HEAD)"
          for i in 1 2 3 4 5; do
            git fetch origin "$BR" || true
            git reset --hard "origin/$BR"
            for f in $FILES; do
              [ -f "$KEEP/$(basename "$f")" ] && cp "$KEEP/$(basename "$f")" "$f"
            done
            HAVE=""
            for f in $FILES; do [ -f "$f" ] && HAVE="$HAVE $f"; done
            if [ -z "$HAVE" ]; then echo "none of $FILES exist -- nothing to commit"; exit 0; fi
            git add -- $HAVE
            if git diff --staged --quiet; then
              echo "identical to remote -- nothing to push"; exit 0
            fi
            git commit -m "chore(remains): daily harvest $(date -u +%Y-%m-%d)"
            if git push origin HEAD:"$BR"; then echo "pushed"; exit 0; fi
            echo "push race, retry $i"; sleep $((i * 5))
          done
          echo "push failed after 5 retries"; exit 1
