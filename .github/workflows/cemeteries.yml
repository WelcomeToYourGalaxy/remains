# Global cemetery / crematorium / mortuary directory from OpenStreetMap, sharded.
#
# This is the FACILITY layer and it is deliberately NOT subject to the unearthings
# map's blurring rule: a working cemetery is a signposted public place people need to
# be able to find. harvest_cemeteries.py refuses every archaeological tag
# (historic=*, tombs, tumuli, necropoleis) and every lifecycle prefix (was:,
# demolished:, removed:, abandoned:) -- those are unearthing EVENTS and belong to
# harvest_remains.py, where the blur applies. See design note 3 in the map.
#
# Cemeteries are far denser than the projects repo's courthouses, so this runs 24
# shards over a 2.5-degree grid with a tighter recursive-split floor.
#
# Output is GZIPPED. A worldwide sweep is 45-75 MB of raw JSON -- past GitHub's 50 MB
# warning and a punishing browser fetch -- so the merged files are committed as
# .json.gz and the map inflates them client-side. Shard artifacts stay plain JSON;
# they are transient and never pushed.
name: Harvest cemeteries

on:
  schedule:
    - cron: '0 4 * * 6'        # Saturdays 04:00 UTC -- full global sweep
  workflow_dispatch:
    inputs:
      fac_type:
        description: 'cemetery | crematory | mortuary | museum | all'
        default: 'all'
        required: false

permissions:
  contents: write

jobs:
  shards:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false          # one bad shard must not kill the others
      # 4 facilities x 8 shards = 32 jobs, but a free public repo gets 20
      # concurrent jobs across the WHOLE account -- so an unthrottled matrix
      # leaves four shards sitting "pending" and starves every other workflow
      # behind it. 12 at a time finishes in two comfortable waves and leaves
      # runners free for the daily harvest and the wire.
      max-parallel: 12
      matrix:
        facility: [cemetery, crematory, mortuary, museum]
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Harvest ${{ matrix.facility }} shard ${{ matrix.shard }}
        env:
          FAC_TYPE: ${{ matrix.facility }}
          FAC_SHARD: ${{ matrix.shard }}
          FAC_SHARDS: '8'
          OSM_BUDGET_MIN: '160'
          OSM_TILE_DEG: '2.5'
          OSM_MIN_DEG: '0.3125'
        run: python harvest_cemeteries.py
      - uses: actions/upload-artifact@v4
        with:
          name: fac-${{ matrix.facility }}-${{ matrix.shard }}
          path: remains_local_${{ matrix.facility }}_part${{ matrix.shard }}.json
          if-no-files-found: warn
          retention-days: 2

  merge:
    needs: shards
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: fac-*
          merge-multiple: true
      - name: Merge shard parts
        run: |
          ls -la remains_local_*_part*.json || echo "no parts downloaded"
          for t in cemetery crematory mortuary; do
            FAC_MERGE=1 FAC_TYPE=$t python harvest_cemeteries.py
          done
          rm -f remains_local_*_part*.json
      - name: Commit if changed
        # Do NOT merge. These jobs REGENERATE the file wholesale, so there is
        # nothing to reconcile -- and `git merge -X ours` cannot help anyway:
        # -X ours resolves conflicting hunks INSIDE a file, and does nothing for a
        # modify/delete TREE conflict. That is exactly what happens when the file
        # was deleted on the remote while this job rebuilt it, which is what broke
        # the 2026-07-30 run: five identical CONFLICT (modify/delete) retries, then
        # exit 1, with a perfectly good 1,887-record harvest thrown away.
        #
        # So: take the remote exactly as it is, drop our freshly built file on top,
        # commit that. Survives deletes, concurrent edits and unrelated commits.
        env:
          FILES: "remains_local_cemetery.json.gz remains_local_crematory.json.gz remains_local_mortuary.json.gz remains_local_museum.json.gz"
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -z "$(git status --porcelain -- $FILES)" ]; then
            echo "No change in $FILES -- nothing to commit."
            exit 0
          fi
          KEEP="$(mktemp -d)"
          for f in $FILES; do [ -f "$f" ] && cp "$f" "$KEEP/$(basename "$f")"; done
          BR="$(git rev-parse --abbrev-ref HEAD)"
          for i in 1 2 3 4 5; do
            git fetch origin "$BR" || true
            git reset --hard "origin/$BR"
            for f in $FILES; do
              [ -f "$KEEP/$(basename "$f")" ] && cp "$KEEP/$(basename "$f")" "$f"
            done
            git add -- $FILES
            if git diff --staged --quiet; then
              echo "identical to remote -- nothing to push"; exit 0
            fi
            git commit -m "chore(facilities): weekly cemetery sweep $(date -u +%Y-%m-%d)"
            if git push origin HEAD:"$BR"; then echo "pushed"; exit 0; fi
            echo "push race, retry $i"; sleep $((i * 5))
          done
          echo "push failed after 5 retries"; exit 1
