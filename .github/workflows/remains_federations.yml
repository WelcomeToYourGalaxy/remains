# Portal federations for the unearthings layer, sharded.
# 6 parallel shards, each taking every 6th portal of the CKAN registry inherited from
# harvest_projects.py, searched with the remains vocabulary. A merge job folds the parts
# into remains.json.gz -- same pattern as projects_federations.yml.
name: Harvest unearthings portal federations (sharded)

on:
  schedule:
    - cron: '45 3 * * 2,5'     # Tue + Fri 03:45 UTC (offset from the projects federation job)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  shard:
    runs-on: ubuntu-latest
    timeout-minutes: 200
    strategy:
      fail-fast: false          # one bad shard must not kill the others
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run federation shard
        env:
          FED_SHARD: ${{ matrix.shard }}
          FED_SHARDS: '6'
          FED_REMAINS_MAX_MIN: '150'
        run: python -u harvest_remains.py
      - uses: actions/upload-artifact@v4
        with:
          name: fed-remains-part-${{ matrix.shard }}
          path: fed_remains_part_${{ matrix.shard }}.json
          if-no-files-found: warn
          retention-days: 2

  merge:
    needs: shard
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: fed-remains-part-*
          merge-multiple: true
      - name: Merge shard parts into remains.json.gz
        env:
          FED_MERGE: '1'
        run: |
          ls -la fed_remains_part_*.json || echo "no parts downloaded"
          python harvest_remains.py
      - name: Commit if changed
        # Do NOT merge. These jobs REGENERATE the file wholesale, so there is
        # nothing to reconcile -- and `git merge -X ours` cannot help anyway:
        # -X ours resolves conflicting hunks INSIDE a file, and does nothing for a
        # modify/delete TREE conflict. That is exactly what happens when the file
        # was deleted on the remote while this job rebuilt it, which is what broke
        # the 2026-07-30 run: five identical CONFLICT (modify/delete) retries, then
        # exit 1, with a perfectly good 1,887-record harvest thrown away.
        #
        # So: take the remote exactly as it is, drop our freshly built file on top,
        # commit that. Survives deletes, concurrent edits and unrelated commits.
        env:
          FILES: "remains.json.gz"
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -z "$(git status --porcelain -- $FILES)" ]; then
            echo "No change in $FILES -- nothing to commit."
            exit 0
          fi
          KEEP="$(mktemp -d)"
          for f in $FILES; do [ -f "$f" ] && cp "$f" "$KEEP/$(basename "$f")"; done
          BR="$(git rev-parse --abbrev-ref HEAD)"
          for i in 1 2 3 4 5; do
            git fetch origin "$BR" || true
            git reset --hard "origin/$BR"
            for f in $FILES; do
              [ -f "$KEEP/$(basename "$f")" ] && cp "$KEEP/$(basename "$f")" "$f"
            done
            HAVE=""
            for f in $FILES; do [ -f "$f" ] && HAVE="$HAVE $f"; done
            if [ -z "$HAVE" ]; then echo "none of $FILES exist -- nothing to commit"; exit 0; fi
            git add -- $HAVE
            if git diff --staged --quiet; then
              echo "identical to remote -- nothing to push"; exit 0
            fi
            git commit -m "chore(remains): federation sweep $(date -u +%Y-%m-%d)"
            if git push origin HEAD:"$BR"; then echo "pushed"; exit 0; fi
            echo "push race, retry $i"; sleep $((i * 5))
          done
          echo "push failed after 5 retries"; exit 1
