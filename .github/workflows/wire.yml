# The unearthings wire: news on THIS subject only, keyed to region.
# Requires a human-remains or burial term, and strips the two things that would
# otherwise swamp it -- discovery spectacle and crime reporting. See wire_remains.py.
name: Harvest unearthings wire

on:
  schedule:
    - cron: '20 */6 * * *'     # every 6 hours, offset from the projects repo's wire
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: harvest-wire-remains
  cancel-in-progress: false

jobs:
  wire:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        # feedparser is optional: wire_remains.py falls back to a built-in RSS
        # reader if the import fails, so a bad install degrades instead of failing.
        run: pip install feedparser || echo "feedparser unavailable -- using fallback parser"
      - name: Harvest wire.json
        env:
          WIRE_MAX_AGE_DAYS: '90'
          WIRE_BUDGET_MIN: '80'
        run: python wire_remains.py
      - name: Commit if changed
        # Do NOT merge. These jobs REGENERATE the file wholesale, so there is
        # nothing to reconcile -- and `git merge -X ours` cannot help anyway:
        # -X ours resolves conflicting hunks INSIDE a file, and does nothing for a
        # modify/delete TREE conflict. That is exactly what happens when the file
        # was deleted on the remote while this job rebuilt it, which is what broke
        # the 2026-07-30 run: five identical CONFLICT (modify/delete) retries, then
        # exit 1, with a perfectly good 1,887-record harvest thrown away.
        #
        # So: take the remote exactly as it is, drop our freshly built file on top,
        # commit that. Survives deletes, concurrent edits and unrelated commits.
        env:
          FILES: "wire.json"
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -z "$(git status --porcelain -- $FILES)" ]; then
            echo "No change in $FILES -- nothing to commit."
            exit 0
          fi
          KEEP="$(mktemp -d)"
          for f in $FILES; do [ -f "$f" ] && cp "$f" "$KEEP/$(basename "$f")"; done
          BR="$(git rev-parse --abbrev-ref HEAD)"
          for i in 1 2 3 4 5; do
            git fetch origin "$BR" || true
            git reset --hard "origin/$BR"
            for f in $FILES; do
              [ -f "$KEEP/$(basename "$f")" ] && cp "$KEEP/$(basename "$f")" "$f"
            done
            git add -- $FILES
            if git diff --staged --quiet; then
              echo "identical to remote -- nothing to push"; exit 0
            fi
            git commit -m "chore(wire): refresh $(date -u +%Y-%m-%dT%H:%MZ)"
            if git push origin HEAD:"$BR"; then echo "pushed"; exit 0; fi
            echo "push race, retry $i"; sleep $((i * 5))
          done
          echo "push failed after 5 retries"; exit 1
