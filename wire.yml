# The unearthings wire: news on THIS subject only, keyed to region.
# Requires a human-remains or burial term, and strips the two things that would
# otherwise swamp it -- discovery spectacle and crime reporting. See wire_remains.py.
name: Harvest unearthings wire

on:
  schedule:
    - cron: '20 */6 * * *'     # every 6 hours, offset from the projects repo's wire
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: harvest-wire-remains
  cancel-in-progress: false

jobs:
  wire:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deps
        # feedparser is optional: wire_remains.py falls back to a built-in RSS
        # reader if the import fails, so a bad install degrades instead of failing.
        run: pip install feedparser || echo "feedparser unavailable -- using fallback parser"
      - name: Harvest wire.json
        env:
          WIRE_MAX_AGE_DAYS: '90'
          WIRE_BUDGET_MIN: '80'
        run: python wire_remains.py
      - name: Commit if changed
        run: |
          git config user.name  "wire-bot"
          git config user.email "actions@users.noreply.github.com"
          git add wire.json
          if git diff --staged --quiet; then echo "no changes"; exit 0; fi
          git commit -m "chore: refresh wire.json"
          BR="$(git rev-parse --abbrev-ref HEAD)"
          for i in 1 2 3 4 5; do
            git fetch origin "$BR" || true
            if git merge -X ours FETCH_HEAD -m "merge remote; keep fresh wire.json" && git push origin HEAD:"$BR"; then
              echo "pushed"; exit 0
            fi
            git merge --abort 2>/dev/null || true
            echo "push race, retry $i"; sleep 6
          done
          echo "push failed after retries"; exit 1
